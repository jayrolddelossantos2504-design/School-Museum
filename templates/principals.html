{% extends "base.html" %}

{% block title %}Principals — General Tinio NHS Heritage Museum{% endblock %}

{% block content %}
<section class="bg-gradient-to-b from-[#0c3125] to-[#145a44] text-white py-12">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h1 class="font-display text-3xl sm:text-4xl md:text-5xl font-bold tracking-tight">Principals of GTNHS</h1>
    <p class="mt-3 text-emerald-100/90 text-lg max-w-2xl mx-auto">Presidents/Principals who led General Tinio National High School through the years.</p>
  </div>
</section>

<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="bg-white rounded-xl shadow-sm border border-[#e6dfd3] overflow-hidden">
    <div class="p-4 sm:p-6">
      <img src="{{ url_for('static', filename='images/The Principals.png') }}" alt="Principals of General Tinio National High School" class="w-full h-auto rounded-lg">
    </div>
  </div>
</section>
{% endblock %}
